# Lo arranca y lo reinicia systemd (citas-monitor.service): ver instalar.sh.
services:
  bot:
    build: .
    image: citas-monitor
    container_name: citas-monitor
    env_file: .env
    # Tu usuario (debuti), para que data/ no quede como root.
    user: "1000:1000"
    volumes:
      - ./data:/data
    restart: "no"
