name: Vigilar citas médicas

on:
  schedule:
    # Cada 10 minutos. El repo es público, así que los minutos de Actions son
    # ilimitados; si volviera a ser privado, sube a "*/30 * * * *" para no
    # pasar de los 2000 min/mes gratis.
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Qué ejecutar"
        type: choice
        options: [check, test-notify]
        default: check

concurrency:
  group: citas-monitor
  cancel-in-progress: false

permissions:
  contents: read
  actions: write  # para "Mantener activo" (abajo)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Recuperar estado (huecos ya avisados)
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: citas-state-${{ github.run_id }}
          # vithas-state-: estado de cuando el repo solo vigilaba Vithas.
          restore-keys: |
            citas-state-
            vithas-state-

      - name: Comprobar disponibilidad
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MONITOR_CONFIG: ${{ secrets.MONITOR_CONFIG }}
          # Formato antiguo, solo se usa si no existe MONITOR_CONFIG.
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VITHAS_CONFIG: ${{ secrets.VITHAS_CONFIG }}
        run: |
          # Cada búsqueda manda un "sigo buscando" (sin sonido); las citas nuevas
          # y los fallos repetidos llegan como alerta con sonido.
          if [ "${{ inputs.mode }}" = "test-notify" ]; then
            python3 monitor.py --test-notify
          else
            python3 monitor.py --heartbeat
          fi

      # En repos públicos GitHub desactiva los workflows programados tras 60 días
      # sin actividad en el repo; volver a habilitarlo reinicia esa cuenta atrás.
      - name: Mantener activo
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/monitor.yml/enable" || true

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: citas-state-${{ github.run_id }}
